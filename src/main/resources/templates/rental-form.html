<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Rental Form</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div th:replace="~{navbar :: body}"></div>

<h2>Rental Form</h2>

<form th:action="${rental.id == null} ? @{/rentals} : @{/rentals/{id}(id=${rental.id})}" th:object="${rental}" method="post">

    <input type="hidden" th:field="*{id}" />

    Renter Name:
    <input type="text" th:field="*{renterName}" name="renterName" /><br/>

    Car ID:
    <input type="number" th:field="*{carId}" name="carId" /><br/>

    Start Date:
    <input type="date" th:field="*{startDate}" name="startDate" /><br/>

    End Date:
    <input type="date" th:field="*{endDate}" name="endDate" /><br/>

    Total Price:
    <input type="number" th:field="*{totalPrice}" name="totalPrice" /><br/>

    <button type="submit" name="btn_submit">Save</button>
</form>

<a href="/rentals">Back</a>

</body>
</html>
